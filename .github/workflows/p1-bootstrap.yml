name: p1-hardening-bootstrap

on:
  push:
    branches: [p1-hardening]

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check P1 bundle
        id: bundle
        shell: bash
        run: |
          if [ -f .bootstrap/p1-part-00.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and validate P1 patch
        if: ${{ steps.bundle.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/p1-part-*.b64 | base64 -d > /tmp/p1-hardening.tar.xz
          sha256sum /tmp/p1-hardening.tar.xz
          xz -t /tmp/p1-hardening.tar.xz
          tar -xJf /tmp/p1-hardening.tar.xz -C .
          rm -rf .bootstrap

      - uses: astral-sh/setup-uv@v6
        if: ${{ steps.bundle.outputs.present == 'true' }}
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        if: ${{ steps.bundle.outputs.present == 'true' }}
        run: uv sync --frozen --dev

      - name: Compile Python sources
        if: ${{ steps.bundle.outputs.present == 'true' }}
        run: uv run python -m compileall -q app tests scripts

      - name: Run full test suite
        if: ${{ steps.bundle.outputs.present == 'true' }}
        run: uv run pytest -q

      - name: Publish verified P1 source
        if: ${{ steps.bundle.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement P1 reliability hardening"
          git push
