name: Import recovered Blood Connect frontend

on:
  push:
    branches: [feat/blood-connect-android-integration]
    paths:
      - '_frontend_import/**'
      - '.github/workflows/import-frontend.yml'

permissions:
  contents: write

jobs:
  restore-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore source from GitHub-safe chunks
        run: |
          if [ ! -d _frontend_import ]; then
            echo "Frontend already restored"
            exit 0
          fi
          cat _frontend_import/part_*.b64 | base64 --decode > /tmp/blood_connect_frontend.zip
          test "$(unzip -Z1 /tmp/blood_connect_frontend.zip | wc -l)" -ge 150
          mkdir -p frontend
          unzip -q /tmp/blood_connect_frontend.zip -d frontend
          rm -rf _frontend_import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A frontend _frontend_import
          git commit -m "Restore Blood Connect Expo source from Drive archive"
          git push
