name: bootstrap-secure-backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bootstrap bundle
        id: bundle
        shell: bash
        run: |
          if [ -f .bootstrap/part-00.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify source bundle
        if: ${{ steps.bundle.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | base64 -d > /tmp/source.tar.xz
          echo "0d74b864c0dd51f265f00387e88bba877015bc66bf79e27587afcd58de1971ab  /tmp/source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/tests.yml

      - name: Align authenticated test fixtures with the verification gate
        if: ${{ steps.bundle.outputs.present == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/conftest.py")
          text = path.read_text()
          for email in (
              "test@example.com",
              "donor@example.com",
              "third@example.com",
              "recent@example.com",
          ):
              old = f'        email="{email}",\n'
              new = old + "        email_verified=True,\n"
              if new not in text:
                  if old not in text:
                      raise SystemExit(f"fixture anchor missing: {email}")
                  text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("tests/test_api_chat.py")
          text = path.read_text()
          old = '        email="nolocation@example.com",\n'
          new = old + "        email_verified=True,\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("nomad fixture anchor missing")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Restore and verify pinned lockfile
        if: ${{ steps.bundle.outputs.present == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/AbuRayhanRU/backend/260007faac654e962736ba965614e639c0dd0fe5/uv.lock \
            -o uv.lock
          echo "0861a113037ebcaa5b1a6ed2161122890a763cd8a2c17feb39affbee3057eb20  uv.lock" | sha256sum -c -

      - uses: astral-sh/setup-uv@v6
        if: ${{ steps.bundle.outputs.present == 'true' }}
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        if: ${{ steps.bundle.outputs.present == 'true' }}
        run: uv sync --frozen --dev

      - name: Compile Python sources
        if: ${{ steps.bundle.outputs.present == 'true' }}
        run: uv run python -m compileall -q app tests scripts

      - name: Run full test suite
        if: ${{ steps.bundle.outputs.present == 'true' }}
        id: pytest
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pytest diagnostics
        if: ${{ steps.bundle.outputs.present == 'true' && steps.pytest.outputs.status != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure
          path: /tmp/pytest.log
          retention-days: 1

      - name: Fail when pytest failed
        if: ${{ steps.bundle.outputs.present == 'true' && steps.pytest.outputs.status != '0' }}
        run: exit 1

      - name: Publish verified source
        if: ${{ steps.bundle.outputs.present == 'true' && steps.pytest.outputs.status == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish P0-hardened blood donation backend"
          git push
