name: p2-lock

on:
  pull_request:
    branches: [main]

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock
      - uses: actions/upload-artifact@v4
        with:
          name: p2-uv-lock
          path: uv.lock
          if-no-files-found: error
