name: p2-lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock
      - run: uv sync --frozen --dev
      - name: Generate P1 baseline revision once
        env:
          DATABASE_URL: sqlite:///./p2_alembic_gen.db
        run: |
          mkdir -p alembic/versions
          if ! find alembic/versions -maxdepth 1 -name '*.py' -print -quit | grep -q .; then
            uv run alembic revision --autogenerate --rev-id 0001_p1_baseline -m "P1 baseline"
          fi
          rm -f p2_alembic_gen.db
      - name: Commit generated dependency/migration files when changed
        run: |
          if [ -n "$(git status --porcelain -- uv.lock alembic/versions)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock alembic/versions
            git commit -m "build: generate P1 Alembic baseline"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: p2-generated-files
          path: |
            uv.lock
            alembic/versions
          if-no-files-found: error
