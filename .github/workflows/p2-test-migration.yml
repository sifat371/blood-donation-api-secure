name: p2-test-migration

on:
  push:
    branches: [p2-core]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p2-core
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: python scripts/migrate_p2_tests.py
      - name: Commit migrated tests
        run: |
          if [ -n "$(git status --porcelain -- tests)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests
            git commit -m "test: migrate P1 lifecycle expectations to P2"
            git push origin HEAD:p2-core
          fi
