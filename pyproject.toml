[project]
name = "backend"
version = "0.1.0"
description = "Blood Donation API — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=4.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "python-dateutil>=2.9.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.51.0",
    "google-auth>=2.29.0",
    "google-genai>=1.0.0",
    "firebase-admin>=7.5.0",
    "email-validator>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
